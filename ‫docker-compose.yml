services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: helper
      POSTGRES_PASSWORD: helper
      POSTGRES_DB: helper
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helper"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://helper:helper@postgres:5432/helper
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:3000"
    command: sh -c "npx prisma migrate deploy && node dist/main.js"

volumes:
  pgdata: